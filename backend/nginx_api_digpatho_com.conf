# NGINX — api.digpatho.com (proxy de producción)
#
# ARQUITECTURA REAL (GCP):
#   Cliente → Cloudflare → Nginx en VM proxy (35.243.243.211, digpatho-ai-ki67a)
#                        → Backend FastAPI (34.23.82.181:8001, backend-digpatho, uvicorn-prepro)
#                        → Microservicio Ki67 local (127.0.0.1:9000 en la VM proxy)
#
# INSTALACIÓN:
#   1. Copiar este archivo a la VM proxy:
#        scp nginx_api_digpatho_com.conf USER@35.243.243.211:/tmp/
#   2. En la VM proxy:
#        sudo cp /etc/nginx/sites-enabled/default /etc/nginx/sites-enabled/default.bak.$(date +%Y%m%d)
#        sudo cp /tmp/nginx_api_digpatho_com.conf /etc/nginx/sites-enabled/default
#        sudo nginx -t && sudo systemctl reload nginx
#
# SSL: certificados Cloudflare Origin en /etc/ssl/cloudflare-origin.pem y cloudflare-origin-key.pem
#
# IMPORTANTE — orden de locations:
#   Los bloques ^~ /upload-wsi/ y ^~ /upload-her2/ DEBEN ir ANTES del regex ~* ^/upload,
#   porque /upload-wsi/* también coincide con ^/upload y sin el bloque dedicado iría a Ki67 (9000) → 404.

server {
    listen 80;
    listen 443 ssl;
    ssl_certificate     /etc/ssl/cloudflare-origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare-origin-key.pem;
    server_name _;

    # Límite global (uploads directos hasta ~90 MB del frontend)
    client_max_body_size 100M;

    # Ki67 / IA — procesar imagen
    location ~* ^/procesar_imagen {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300;
    }

    # Ki67 / IA — upload imagen
    location ~* ^/upload_imagen {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300;
    }

    # WSI — backend (subida directa y fragmentada: init/chunk/complete)
    location ^~ /upload-wsi/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin https://app.digpatho.com always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Content-Length 0;
            return 204;
        }
        add_header Access-Control-Allow-Origin https://app.digpatho.com always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        proxy_pass http://34.23.82.181:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600;
        client_max_body_size 200M;
    }

    # HER2 — backend
    location ^~ /upload-her2/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin https://app.digpatho.com always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Content-Length 0;
            return 204;
        }
        add_header Access-Control-Allow-Origin https://app.digpatho.com always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        proxy_pass http://34.23.82.181:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300;
        client_max_body_size 100M;
    }

    # Ki67 upload genérico (/upload/) — NO captura /upload-wsi ni /upload-her2 (bloques ^~ arriba)
    location ~* ^/upload {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin https://app.digpatho.com always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Content-Length 0;
            return 204;
        }
        add_header Access-Control-Allow-Origin https://app.digpatho.com always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300;
        client_max_body_size 100M;
    }

    location /health {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
    }

    # Todo lo demás → backend principal
    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin https://app.digpatho.com always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Content-Length 0;
            return 204;
        }
        add_header Access-Control-Allow-Origin https://app.digpatho.com always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        proxy_pass http://34.23.82.181:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300;
    }
}
