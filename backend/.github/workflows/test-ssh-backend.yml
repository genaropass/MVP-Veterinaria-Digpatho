name: Test SSH Backend

on:
  workflow_dispatch:

jobs:
  ssh-test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Test SSH Connection to Backend
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.USER_SSH }}@${{ secrets.HOST_BACKEND }} "echo '✅ Conexión SSH exitosa con backend'"
