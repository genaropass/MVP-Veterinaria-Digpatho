<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Contacto - Digpatho</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        
        input[type="text"],
        input[type="email"],
        textarea,
        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus,
        input[type="email"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        textarea {
            resize: vertical;
            min-height: 120px;
            font-family: inherit;
        }
        
        input[type="file"] {
            padding: 8px;
            cursor: pointer;
        }
        
        .file-info {
            margin-top: 8px;
            font-size: 12px;
            color: #666;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .required {
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Contacto</h1>
        <p class="subtitle">Completa el formulario y te responderemos a la brevedad</p>
        
        <form id="contactForm">
            <div class="form-group">
                <label for="name">Nombre <span class="required">*</span></label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email <span class="required">*</span></label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="message">Mensaje</label>
                <textarea id="message" name="message" placeholder="Describe tu consulta o solicitud..."></textarea>
            </div>
            
            <div class="form-group">
                <label for="images">Imágenes (máx 5, 5MB cada una) <span class="required">*</span></label>
                <input type="file" id="images" name="images" accept="image/*" multiple required>
                <div class="file-info" id="fileInfo"></div>
            </div>
            
            <button type="submit" id="submitBtn">Enviar Solicitud</button>
            
            <div class="message" id="messageDiv"></div>
        </form>
    </div>

    <script>
        const form = document.getElementById('contactForm');
        const fileInput = document.getElementById('images');
        const fileInfo = document.getElementById('fileInfo');
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('messageDiv');
        
        // Mostrar información de archivos seleccionados
        fileInput.addEventListener('change', (e) => {
            const files = e.target.files;
            if (files.length > 0) {
                let info = `Seleccionadas: ${files.length} imagen(es)\n`;
                let totalSize = 0;
                
                Array.from(files).forEach((file, index) => {
                    const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
                    totalSize += file.size;
                    info += `${index + 1}. ${file.name} (${sizeMB} MB)\n`;
                });
                
                const totalSizeMB = (totalSize / (1024 * 1024)).toFixed(2);
                info += `\nTamaño total: ${totalSizeMB} MB`;
                
                fileInfo.textContent = info;
                
                // Validar cantidad
                if (files.length > 5) {
                    fileInfo.style.color = '#e74c3c';
                    fileInfo.textContent += '\n⚠️ Máximo 5 imágenes permitidas';
                    submitBtn.disabled = true;
                } else {
                    fileInfo.style.color = '#666';
                    submitBtn.disabled = false;
                }
            } else {
                fileInfo.textContent = '';
            }
        });
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(form);
            const files = fileInput.files;
            
            // Validaciones adicionales
            if (files.length > 5) {
                showMessage('Máximo 5 imágenes permitidas', 'error');
                return;
            }
            
            // Validar tamaño de cada archivo (5MB)
            let hasLargeFile = false;
            Array.from(files).forEach(file => {
                if (file.size > 5 * 1024 * 1024) {
                    hasLargeFile = true;
                }
            });
            
            if (hasLargeFile) {
                showMessage('Una o más imágenes exceden el tamaño máximo de 5MB', 'error');
                return;
            }
            
            // Deshabilitar botón durante el envío
            submitBtn.disabled = true;
            submitBtn.textContent = 'Enviando...';
            
            try {
                // Cambiar esta URL por la de tu backend
                const API_URL = '/api/contact'; // O 'https://tu-dominio.com/api/contact'
                
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    showMessage('¡Solicitud enviada correctamente! Te contactaremos pronto.', 'success');
                    form.reset();
                    fileInfo.textContent = '';
                } else {
                    showMessage('Error: ' + (result.detail || 'No se pudo enviar la solicitud'), 'error');
                }
            } catch (error) {
                showMessage('Error de conexión: ' + error.message, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Enviar Solicitud';
            }
        });
        
        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
            
            // Ocultar después de 5 segundos
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
