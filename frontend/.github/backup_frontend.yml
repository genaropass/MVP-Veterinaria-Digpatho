name: Backup Frontend to Google Drive
on:
  push:
    branches:
      - main
      # Agrega aquí otras ramas si usas 'develop' o 'preproduccion'

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Create ZIP with timestamp
        run: |
          TIMESTAMP=$(date +"%Y-%m-%d_%H-%M")
          # Le pongo FRONTEND en mayúsculas para diferenciarlo del otro
          ZIP_NAME="backup-FRONTEND-${TIMESTAMP}.zip"
          
          # IMPORTANTE: El -x excluye 'node_modules' y '.git' para que el zip sea liviano
          zip -r "$ZIP_NAME" . -x "node_modules/*" ".git/*" ".next/*" "dist/*"
          
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Configure rclone
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo -e "$RCLONE_CONFIG" > ~/.config/rclone/rclone.conf

      - name: Upload ZIP to Google Drive
        run: |
          # Lo enviamos al mismo lugar
          rclone copy "$ZIP_NAME" digpathobackend: --progress
