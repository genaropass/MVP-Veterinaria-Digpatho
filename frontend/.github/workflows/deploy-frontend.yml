name: Deploy DigpathoWeb

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout DigpathoWeb repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies and build
        env:
          NEXT_PUBLIC_API_URL: https://api.digpatho.com/
          NEXT_PUBLIC_APP_URL: https://app.digpatho.com
        run: |
          npm install
          npm run build

      # Write SSH key to file so we use it explicitly (avoids agent/format issues). The key in
      # SSH_PRIVATE_KEY must be the *private* key; the matching *public* key must be in
      # ~/.ssh/authorized_keys on the VM for user USER_SSH (one line from the .pub file).
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Copy files to server (deploy temp folder)
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.USER_SSH }}@${{ secrets.HOST_FRONTEND }} "mkdir -p /opt/digpatho/DigpathoWeb_new"
          rsync -avz --delete -e "ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.USER_SSH }}@${{ secrets.HOST_FRONTEND }}:/opt/digpatho/DigpathoWeb_new/

      - name: Deploy on server with rollback
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.USER_SSH }}@${{ secrets.HOST_FRONTEND }} << 'EOF'
            set -e
            DEPLOY_ROOT="/opt/digpatho"
            APP_DIR="$DEPLOY_ROOT/DigpathoWeb"
            APP_NEW="$DEPLOY_ROOT/DigpathoWeb_new"

            if [ ! -d "$APP_NEW" ]; then
              echo "❌ No se encontró $APP_NEW (revisar que SCP haya copiado a /opt/digpatho y la carpeta se llame DigpathoWeb_new)"
              exit 1
            fi

            # Backup .env para no perderlo al reemplazar
            if [ -d "$APP_DIR" ] && [ -f "$APP_DIR/.env.production" ]; then
              cp "$APP_DIR/.env.production" /tmp/digpatho_env_production.bak
              echo "Backup .env.production guardado"
            fi
            if [ -d "$APP_DIR" ] && [ -f "$APP_DIR/.env.local" ]; then
              cp "$APP_DIR/.env.local" /tmp/digpatho_env_local.bak
            fi

            if [ -d "$APP_DIR" ]; then
              mv "$APP_DIR" "${APP_DIR}_backup_$(date +%Y%m%d%H%M%S)"
            fi

            mv "$APP_NEW" "$APP_DIR"
            cd "$APP_DIR"

            if [ -f /tmp/digpatho_env_production.bak ]; then
              cp /tmp/digpatho_env_production.bak "$APP_DIR/.env.production"
              rm /tmp/digpatho_env_production.bak
              echo ".env.production restaurado"
            fi
            if [ -f /tmp/digpatho_env_local.bak ]; then
              cp /tmp/digpatho_env_local.bak "$APP_DIR/.env.local"
              rm /tmp/digpatho_env_local.bak
            fi

            echo "Reiniciando pm2 (digpatho-web)..."
            pm2 restart digpatho-web --update-env || pm2 start ecosystem.config.cjs

            echo "Esperando que Next.js responda en puerto 3000..."
            max_attempts=12
            attempt_num=1

            until curl -s http://localhost:3000 > /dev/null; do
              if [ $attempt_num -ge $max_attempts ]; then
                echo "⚠️ Server no responde en 3000, rollback..."

                pm2 delete digpatho-web || true
                rm -rf "$APP_DIR"

                latest_backup=$(ls -td ${APP_DIR}_backup_* 2>/dev/null | head -1)
                if [ -n "$latest_backup" ]; then
                  mv "$latest_backup" "$APP_DIR"
                  cd "$APP_DIR"
                  pm2 start ecosystem.config.cjs
                else
                  echo "⚠️ No hay backup para restaurar"
                  exit 1
                fi
                exit 1
              fi
              echo "Intento $attempt_num: esperando 5 s..."
              attempt_num=$((attempt_num+1))
              sleep 5
            done

            echo "✅ Next.js respondió en puerto 3000"

            echo "🧹 Limpiando backups antiguos..."
            find "$DEPLOY_ROOT" -maxdepth 1 -type d -name 'DigpathoWeb_backup_*' -mmin +60 -exec rm -rf {} + 2>/dev/null || true
          EOF
